name: Refresh poe.ninja market snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-market-data.yml"
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poe-ninja-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout market-data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch economy data from poe.ninja
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from "node:fs";

          const file = "poe-ninja-market.json";
          const previous = existsSync(file) ? JSON.parse(readFileSync(file, "utf8")) : {};
          const previousResponses = previous.apiResponses ?? {};
          const headers = {
            Accept: "application/json",
            "User-Agent": "POE-Filter-Forge/0.1.0 (https://github.com/mpjbiologo/poe-loot-filter-creator)"
          };

          async function getJson(key, url) {
            const requestHeaders = { ...headers };
            if (previousResponses[key]?.etag) requestHeaders["If-None-Match"] = previousResponses[key].etag;
            const response = await fetch(url, { headers: requestHeaders });
            if (response.status === 304 && previousResponses[key]?.items) {
              return { etag: previousResponses[key].etag, cachedItems: previousResponses[key].items };
            }
            if (response.status === 304) {
              const retry = await fetch(url, { headers });
              if (!retry.ok) throw new Error(`poe.ninja ${key}: HTTP ${retry.status}`);
              return { etag: retry.headers.get("etag"), data: await retry.json() };
            }
            if (!response.ok) throw new Error(`poe.ninja ${key}: HTTP ${response.status}`);
            return { etag: response.headers.get("etag"), data: await response.json() };
          }

          const leaguesResponse = await getJson("leagues", "https://poe.ninja/poe1/api/economy/leagues");
          const leagues = leaguesResponse.data;
          if (!Array.isArray(leagues) || leagues.length === 0) throw new Error("poe.ninja não retornou ligas ativas.");
          const league = leagues.find(entry => /covens/i.test(entry.id + " " + entry.name)) ?? leagues[0];

          const leagueParam = "?league=" + encodeURIComponent(league.id) + "&type=";
          const currencyBase = "https://poe.ninja/poe1/api/economy/stash/current/currency/overview";
          const exchangeBase = "https://poe.ninja/poe1/api/economy/exchange/current/overview";
          const itemBase = "https://poe.ninja/poe1/api/economy/stash/current/item/overview";

          const exchangeTypes = [
            "Runegraft","AllflameEmber","Tattoo","Omen","DjinnCoin","Ducat","EnshroudingCrystal",
            "DivinationCard","Artifact","Oil","DeliriumOrb","Astrolabe","Thread","Fossil","Resonator","Essence"
          ];
          const itemTypes = [
            "Wombgift","Corpse","Viscera","Incubator","UniqueWeapon","UniqueArmour","UniqueAccessory",
            "UniqueFlask","UniqueJewel","ForbiddenJewel","ShrineBelt","UniqueTincture","UniqueRelic",
            "SkillGem","ImbuedGem","ClusterJewel","Map","BlightedMap","BlightRavagedMap","UniqueMap",
            "ValdoMap","Invitation","Memory","IncursionTemple","ScryingOrb","BaseType","Flask","Beast","Vial"
          ];
          const requests = [
            ...["Currency","Fragment"].map(type => ({ type, endpoint: currencyBase, kind: "currency" })),
            ...exchangeTypes.map(type => ({ type, endpoint: exchangeBase, kind: "exchange" })),
            ...itemTypes.map(type => ({ type, endpoint: itemBase, kind: "item" }))
          ];
          const responses = [];
          // Limita concorrência para respeitar a API pública do poe.ninja.
          for (let offset = 0; offset < requests.length; offset += 4) {
            const batch = await Promise.all(requests.slice(offset, offset + 4).map(async request => {
              const key = request.type.toLowerCase();
              try {
                const response = await getJson(key, request.endpoint + leagueParam + encodeURIComponent(request.type));
                return { ...request, response };
              } catch (error) {
                console.log("Categoria não disponível nesta atualização: " + request.type + " · " + error.message);
                return { ...request, response: null };
              }
            }));
            responses.push(...batch);
          }

          const items = [];
          const apiResponses = { leagues: leaguesResponse };
          for (const entry of responses) {
            if (!entry.response?.data) continue;
            if (entry.response.cachedItems) {
              apiResponses[entry.type.toLowerCase()] = { etag: entry.response.etag, items: entry.response.cachedItems };
              items.push(...entry.response.cachedItems);
              continue;
            }
            const data = entry.response.data;
            const normalized = [];
            if (entry.kind === "currency") {
              for (const line of data.lines ?? []) {
                const name = line.currencyTypeName;
                if (name) normalized.push({
                  id: entry.type + ":" + name, name,
                  chaosValue: Number(line.chaosEquivalent) || 0, category: entry.type
                });
              }
            } else if (entry.kind === "exchange") {
              const metadata = new Map((data.core?.items ?? []).map(item => [String(item.id), item]));
              for (const line of data.lines ?? []) {
                const detail = metadata.get(String(line.id));
                const name = detail?.name ?? line.name;
                if (!name) continue;
                const primary = String(data.core?.primary ?? "").toLowerCase();
                normalized.push({
                  id: entry.type + ":" + name, name,
                  ...(primary.includes("chaos") ? { chaosValue: Number(line.primaryValue) || 0 } : {}),
                  category: entry.type
                });
              }
            } else {
              for (const line of data.lines ?? []) {
                const name = line.name ?? line.baseType;
                if (!name) continue;
                normalized.push({
                  id: entry.type + ":" + name + ":" + (line.baseType ?? ""),
                  name, baseType: line.baseType,
                  ...(Number.isFinite(Number(line.chaosValue)) ? { chaosValue: Number(line.chaosValue) } : {}),
                  category: entry.type
                });
              }
            }
            apiResponses[entry.type.toLowerCase()] = { etag: entry.response.etag, items: normalized };
            items.push(...normalized);
          }
          const uniqueItems = new Map();
          for (const item of items) uniqueItems.set(item.id, item);
          const sortedItems = [...uniqueItems.values()].sort((a, b) => (b.chaosValue ?? 0) - (a.chaosValue ?? 0));

          const snapshot = {
            schemaVersion: 3,
            generatedAt: new Date().toISOString(),
            league: { id: league.id, name: league.name },
            items: sortedItems,
            apiResponses
          };
          writeFileSync(file, JSON.stringify(snapshot, null, 2) + "\n");
          console.log(`Snapshot atualizado: ${sortedItems.length} itens · ${league.name}`);
          NODE
      - name: Publish snapshot to market-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poe-ninja-market.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados de mercado."
            exit 0
          fi
          git commit -m "chore: refresh poe.ninja market snapshot"
          git push origin HEAD:market-data
